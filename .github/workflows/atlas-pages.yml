name: Publish ATLAS dashboard
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atlas-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public exporter
        run: python3 -m unittest discover -s ATLAS/tests -p test_dashboard.py
      - name: Require an exported public snapshot
        run: |
          test -s ATLAS/site/data.js
          test -s ATLAS/site/snapshot.json
          test -s ATLAS/site/shards.tsv
          python3 -c 'import json; d=json.load(open("ATLAS/site/snapshot.json")); assert d["audit_status"] == "pass"'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ATLAS/site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4